<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Steppi - Register</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-page"><h1 class="head">Create your Steppi account</h1><form id="registerForm" class="auth-form"><input id="name" type="text" placeholder="Your name" required><input id="email" type="email" placeholder="Email address" required><input id="password" type="password" placeholder="Password (at least 6 characters)" minlength="6" required><button type="submit">Register</button></form><p id="message" class="auth-message"></p><p class="auth-link">Already have an account? <a href="login.html">Log in</a></p><script src="register.js"></script></body></html>
